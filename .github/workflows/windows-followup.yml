name: Build Windows follow-up artifacts
on:
  workflow_dispatch:
    inputs:
      version:
        description: Windows package version (no v prefix)
        required: true
        default: '1.7.8'
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build and validate package
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Arch '${{ matrix.arch }}' -Version $env:PACKAGE_VERSION
      - uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*-Setup.exe
            dist/*.sha256
            dist/*.png
            dist/*-validation.json
          compression-level: 0
          if-no-files-found: error
      # Artifacts are not a public release. Real Windows input/microphone and
      # tab-return checks still require an explicit per-binary validation report.
