name: Build DictaNest candidates
on:
  pull_request:
    paths:
      - 'International/**'
      - '.github/workflows/dictanest-windows.yml'
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build and verify international candidates
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force International/tests/fixtures | Out-Null
          Copy-Item tests/fixtures/mixed-test.wav, tests/fixtures/room-noise-test.wav International/tests/fixtures/
          ./International/scripts/build-windows.ps1 -Arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v6
        with:
          name: dictanest-windows-${{ matrix.arch }}
          path: |
            International/dist/*.zip
            International/dist/*-Setup.exe
            International/dist/*.sha256
            International/dist/*.png
          compression-level: 0
          if-no-files-found: error
