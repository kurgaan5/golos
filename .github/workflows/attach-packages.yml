name: Attach tested packages to release draft
on:
  workflow_dispatch:
    inputs:
      windows_run:
        description: Successful Windows build run ID
        required: true
      macos_run:
        description: Successful Intel Mac run ID (optional)
        required: false
      version:
        description: Existing draft release tag
        required: true
        default: v1.7.0
permissions:
  actions: read
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WINDOWS_RUN: ${{ inputs.windows_run }}
      MACOS_RUN: ${{ inputs.macos_run }}
      RELEASE_TAG: ${{ inputs.version }}
    steps:
      - name: Require all platform checks to pass
        shell: bash
        run: |
          set -euo pipefail
          [[ "$WINDOWS_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$WINDOWS_RUN/jobs" > windows.json
          jq -e '[.jobs[] | select(.name | startswith("windows ("))] | length == 2 and all(.status == "completed" and .conclusion == "success")' windows.json
          if [[ -n "$MACOS_RUN" ]]; then
            [[ "$MACOS_RUN" =~ ^[0-9]+$ ]]
            gh api "repos/$GH_REPO/actions/runs/$MACOS_RUN/jobs" > macos.json
            jq -e '[.jobs[] | select(.name == "macos-intel")] | length == 1 and all(.status == "completed" and .conclusion == "success")' macos.json
          fi
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx true
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.windows_run }}
          pattern: windows-*
          path: packages
          merge-multiple: true
      - uses: actions/download-artifact@v8
        if: inputs.macos_run != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.macos_run }}
          pattern: macos-*
          path: packages
          merge-multiple: true
      - uses: actions/upload-artifact@v6
        with:
          name: windows-previews
          path: packages/*.png
          if-no-files-found: error
      - name: Verify and attach installers
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd packages
          for checksum in *.sha256; do sha256sum -c "$checksum"; done
          files=(*.zip *.dmg *-Setup.exe *.sha256)
          gh release upload "$RELEASE_TAG" --clobber "${files[@]}"
